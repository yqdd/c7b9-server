plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.bmuschko.docker-spring-boot-application' version "10.0.0"
}

group = 'com.ow0b'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

docker {
    springBootApplication {
        baseImage = 'openjdk:17-slim'
        ports = [8080]
        images = ['c7b9-server:latest']
        jvmArgs = ['-Xmx4096m']
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.jetbrains:annotations:24.0.0'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.alibaba:dashscope-sdk-java:2.20.8'
    implementation 'com.mysql:mysql-connector-j:9.2.0'
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.hibernate.orm:hibernate-core:7.0.2.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.springframework:spring-orm:6.2.8'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation project('midi')
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    implementation 'com.github.mwiede:jsch:2.27.6'
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}